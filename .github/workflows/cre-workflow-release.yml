name: cre workflow release

# Builds the artifact, commits it, and tags that commit so raw.githubusercontent serves it from an
# immutable SHA. Dispatch rather than tag-triggered on purpose: the artifact has to be IN the tagged
# commit, so the tag cannot be what starts the build.
#
# It stops at publishing. Registering the ID is a mainnet upsertWorkflow - a DAO vote once the proxy
# owns the workflow - and stays a deliberate human step.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: tag to create, e.g. cre-workflow-v2
        required: true
      target:
        description: cre target settings
        default: testnets-settings
      config:
        description: config file the ID is computed against
        default: cre-workflow/workflow/config.testnets.json

permissions:
  contents: write

env:
  CRE_CLI_VERSION: v1.30.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # install.sh puts the binary at $CRE_INSTALL/bin/cre, defaulting to ~/.cre
      - name: install the cre cli
        run: |
          curl -sSL https://app.chain.link/install.sh | bash -s -- "$CRE_CLI_VERSION"
          echo "$HOME/.cre/bin" >> "$GITHUB_PATH"

      # GITHUB_PATH only applies to later steps, so this is where a bad path surfaces
      - name: check the cli is on PATH
        run: cre version

      - run: pip install eth-abi eth-utils brotli

      # the generated bindings live under contracts/ and resolve viem and the sdk from its own
      # node_modules, so both package roots need installing
      - name: install deps
        run: |
          (cd cre-workflow/workflow && bun install --frozen-lockfile)
          (cd cre-workflow/contracts && bun install --frozen-lockfile)

      - name: build and package
        working-directory: cre-workflow
        run: cre workflow build workflow/ --target "${{ inputs.target }}" -o /tmp/binary.wasm

      - name: package
        run: |
          python scripts/workflow_id.py package \
            --wasm /tmp/binary.wasm --out cre-workflow/workflow/binary.wasm.br.b64

      - name: commit, tag and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # the artifact is gitignored for day to day work, so force it in for the release commit
          git add -f cre-workflow/workflow/binary.wasm.br.b64
          git commit -F - <<'MSG'
          chore: publish the cre workflow artifact for this release, the registry stores a url and chainlink's storage is not publicly readable
          MSG
          git tag -a "${{ inputs.tag }}" -m "cre workflow artifact ${{ inputs.tag }}"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "${{ inputs.tag }}"

      - name: report the urls and id
        run: |
          SHA=$(git rev-parse HEAD)
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/$SHA/cre-workflow/workflow"
          CFG="${{ inputs.config }}"
          BURL="$BASE/binary.wasm.br.b64"
          CURL_="https://raw.githubusercontent.com/${{ github.repository }}/$SHA/$CFG"
          # hash the bytes as SERVED, which is what the nodes fetch
          ID=$(python scripts/workflow_id.py urls --binary-url "$BURL" --config-url "$CURL_" \
                 --name blockhash-relay-testnets)
          {
            echo "### ${{ inputs.tag }} published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$SHA\` |"
            echo "| binaryUrl | $BURL |"
            echo "| configUrl | $CURL_ |"
            echo "| workflowId | \`$ID\` |"
            echo ""
            echo "Next: \`upsertWorkflow\` on mainnet with that ID and those URLs."
          } >> "$GITHUB_STEP_SUMMARY"
